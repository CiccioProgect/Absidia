<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manutenzione - Absidia</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=IM+Fell+English:ital@0;1&family=Uncial+Antiqua&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-ocean: #09131a;
            --border-brass: #c29b38;
            --text-foam: #e6edf2;
            --text-faded: #8aa0b3; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-ocean);
            color: var(--text-foam);
            font-family: 'IM Fell English', serif;
            font-size: 1.1rem;
            line-height: 1.7;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Sfondo filigranato con Logo Completo.png */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('Logo Completo.png');
            background-position: center;
            background-repeat: no-repeat;
            background-size: 50% auto;
            opacity: 0.04;
            pointer-events: none;
            z-index: -1;
        }

        /* Intestazione Globale fissa */
        header {
            text-align: center;
            padding: 2rem 1rem 1.5rem 1rem;
            background: linear-gradient(to bottom, rgba(5, 11, 15, 0.95), rgba(9, 19, 26, 0.8));
            border-bottom: 1px solid var(--text-faded);
            position: relative;
        }

        .back-link {
            font-family: 'Cinzel', serif;
            color: var(--text-faded);
            text-decoration: none;
            font-size: 0.855rem;
            letter-spacing: 2px;
            transition: color 0.3s ease;
            position: absolute;
            left: 2rem;
            top: 2rem;
        }

        .back-link:hover {
            color: var(--text-foam);
        }

        .header-stack-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
        }

        .header-logo-cappello {
            height: 130px;
            width: auto;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.9)) sepia(30%) hue-rotate(170deg) saturate(70%) blur(0.8px);
            opacity: 0.85;
        }

        .header-logo-scritta {
            height: 65px;
            width: auto;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.95));
        }

        /* Contenitore Principale */
        main {
            width: 90%;
            max-width: 1100px;
            margin: auto;
            flex-grow: 1;
            padding: 3rem 0;
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
            align-items: center;
            justify-content: center;
        }

        /* Riquadro del Titolo Dinamico centrale */
        .section-title-box {
            background-color: rgba(17, 30, 38, 0.85);
            border: 2px solid var(--text-faded);
            border-radius: 8px;
            padding: 1.5rem 2rem;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 950px;
            height: 120px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .header-animated-text {
            font-family: 'Cinzel', serif;
            font-weight: 800;
            color: var(--text-foam);
            font-size: 2rem;
            letter-spacing: 4px;
            text-shadow: 0 0 12px rgba(138, 160, 179, 0.4);
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        .header-animated-text.visible {
            opacity: 1;
        }

        /* Effetto Autocompilazione (Typewriter) */
        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        .typewriter {
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            letter-spacing: 4px;
            animation: typing 2s steps(10, end) forwards;
            width: 0;
        }

        /* Effetto Lampeggiante con Zoom In e Zoom Out */
        @keyframes pulseZoom {
            0% { opacity: 1; transform: scale(1); text-shadow: 0 0 12px rgba(138, 160, 179, 0.4); }
            50% { opacity: 0.4; transform: scale(1.06); text-shadow: 0 0 25px rgba(194, 155, 56, 0.7); }
            100% { opacity: 1; transform: scale(1); text-shadow: 0 0 12px rgba(138, 160, 179, 0.4); }
        }

        .maintenance-fx {
            animation: pulseZoom 2s infinite ease-in-out;
        }

        footer {
            text-align: center;
            padding: 0.8rem;
            color: var(--text-faded);
            font-size: 0.8rem;
            font-family: 'Cinzel', serif;
            border-top: 1px solid var(--text-faded);
            background-color: #070e12;
        }

        @media (max-width: 900px) {
            .back-link {
                position: static;
                display: block;
                margin-bottom: 1rem;
            }
            .header-logo-cappello { height: 100px; }
            .header-logo-scritta { height: 50px; }
            .section-title-box { max-width: 100%; height: 100px; }
            .header-animated-text { font-size: 1.3rem; letter-spacing: 2px; }
        }
    </style>
</head>
<body>

    <script>
        // Controllo di protezione tramite sessione (coerente con le altre pagine del portale)
        const sessionRole = sessionStorage.getItem("absidia_session");
        if (!sessionRole || (sessionRole !== "admin_unlocked" && sessionRole !== "viewer_unlocked")) {
            window.location.href = "index.html"; // Reindirizza al login se non autenticato
        }
    </script>

    <header>
        <a href="portale.html" class="back-link">&larr; TORNA AL PORTALE</a>
        <div class="header-stack-container">
            <img src="Cappello.png" alt="Absidia Cappello" class="header-logo-cappello">
            <div>
                <img src="Logo Scritta.png" alt="ABSIDIA" class="header-logo-scritta">
            </div>
        </div>
    </header>

    <main>
        <div class="section-title-box">
            <div id="dynamic-text" class="header-animated-text"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Absidia - Un progetto di Elaya - Tutti i diritti riservati.</p>
    </footer>

    <script>
        const textBox = document.getElementById("dynamic-text");

        function startMaintenanceSequence() {
            // Fase 1: Scritta LOADING... con effetto autocompilazione
            textBox.innerHTML = '<span class="typewriter">LOADING...</span>';
            textBox.classList.add("visible");

            // Dopo 4 secondi, dissolvenza in uscita, cambio testo e dissolvenza in entrata con effetto zoom/lampeggio
            setTimeout(() => {
                textBox.classList.remove("visible"); // Dissolvenza in uscita

                setTimeout(() => {
                    textBox.innerHTML = "MANUTENZIONE";
                    textBox.classList.add("maintenance-fx"); // Applica zoom e lampeggio continuo
                    textBox.classList.add("visible");        // Dissolvenza in entrata
                }, 800); // Sincronizzato con la durata della transizione CSS (0.8s)

            }, 4000);
        }

        // Avvia la sequenza all'apertura della pagina
        window.onload = startMaintenanceSequence;
    </script>

</body>
</html>
