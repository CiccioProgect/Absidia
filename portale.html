<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absidia - Portale di Elaya</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=IM+Fell+English:ital@0;1&family=Uncial+Antiqua&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-ocean: #09131a;
            --border-brass: #c29b38;
            --text-foam: #e6edf2;
            --text-faded: #8aa0b3; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-ocean);
            color: var(--text-foam);
            font-family: 'IM Fell English', serif;
            font-size: 1.1rem;
            line-height: 1.7;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Sfondo filigranato con Logo Completo.png */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('Logo Completo.png');
            background-position: center;
            background-repeat: no-repeat;
            background-size: 50% auto;
            opacity: 0.04;
            pointer-events: none;
            z-index: -1;
        }

        /* Intestazione Globale fissa */
        header {
            text-align: center;
            padding: 2rem 1rem 1rem 1rem;
            background: linear-gradient(to bottom, rgba(5, 11, 15, 0.95), rgba(9, 19, 26, 0.8));
            border-bottom: 1px solid var(--text-faded);
        }

        .header-stack-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
        }

        .header-logo-cappello {
            height: 130px;
            width: auto;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.9)) sepia(30%) hue-rotate(170deg) saturate(70%) blur(0.8px);
            opacity: 0.85;
        }

        .header-logo-scritta {
            height: 65px;
            width: auto;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.95));
            margin-bottom: -0.2rem;
        }

        header p {
            color: var(--text-faded);
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Contenitore Principale del Portale */
        main {
            width: 90%;
            max-width: 1000px;
            margin: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 0;
            gap: 2.5rem;
        }

        .portal-content-box {
            background-color: rgba(17, 30, 38, 0.85);
            border: 2px solid var(--text-faded);
            border-radius: 6px;
            padding: 2rem;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 700px;
            height: 150px;
            display: flex;
            align-items: center; 
            justify-content: center; 
            text-align: center;
        }

        /* Sezione Pulsanti di Navigazione */
        .portal-nav-buttons {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 800px;
        }

        .portal-btn {
            font-family: 'Cinzel', serif;
            background-color: rgba(17, 30, 38, 0.9);
            color: var(--text-foam);
            border: 2px solid var(--text-faded);
            padding: 0.9rem 1.8rem;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 2px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            min-width: 200px;
        }

        .portal-btn:hover {
            background-color: var(--text-faded);
            color: var(--bg-ocean);
            border-color: var(--text-foam);
            box-shadow: 0 0 20px rgba(138, 160, 179, 0.5);
            transform: translateY(-3px);
        }

        /* Testo dinamico con effetto dissolvenza */
        .dynamic-text {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-foam);
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(138, 160, 179, 0.4);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transform: translateY(4px);
            opacity: 1;
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
        }

        .cursor {
            display: inline-block;
            background-color: var(--text-foam);
            width: 3px;
            height: 2rem;
            margin-left: 4px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .fade-out {
            opacity: 0;
            transform: scale(0.95);
        }

        .pulse-effect {
            animation: doublePulse 5s ease-in-out infinite;
        }

        @keyframes doublePulse {
            0%, 100% { transform: scale(1); }
            20% { transform: scale(1.08); }
            40% { transform: scale(1); }
            60% { transform: scale(1.08); }
            80% { transform: scale(1); }
        }

        /* Pannello Riservato SysAdmin */
        .admin-control-panel {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--text-faded);
            border: 2px solid var(--text-faded);
            border-radius: 6px;
            padding: 0.8rem 1.2rem;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
            z-index: 999;
            font-family: 'Cinzel', serif;
            text-align: right;
        }

        .admin-control-panel span {
            display: block;
            color: var(--bg-ocean);
            font-size: 0.75rem;
            letter-spacing: 1px;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
        }

        .admin-btn {
            display: inline-block;
            font-family: 'Cinzel', serif;
            background-color: var(--bg-ocean);
            color: var(--text-faded);
            border: 2px solid var(--bg-ocean);
            padding: 0.4rem 0.8rem;
            font-weight: 800;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .admin-btn:hover {
            background-color: var(--text-faded);
            color: var(--bg-ocean);
            border-color: var(--bg-ocean);
            box-shadow: 0 0 15px rgba(138, 160, 179, 0.4);
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            padding: 0.8rem;
            color: var(--text-faded);
            font-size: 0.8rem;
            font-family: 'Cinzel', serif;
            border-top: 1px solid var(--text-faded);
            background-color: #070e12;
        }

        @media (max-width: 768px) {
            .header-logo-cappello { height: 100px; }
            .header-logo-scritta { height: 50px; }
            .portal-content-box { height: 130px; }
            .dynamic-text { font-size: 1.5rem; }
            .cursor { height: 1.4rem; }
            .portal-nav-buttons { gap: 1rem; }
            .portal-btn { width: 100%; min-width: unset; }
            .admin-control-panel { bottom: 10px; right: 10px; padding: 0.6rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-stack-container">
            <img src="Cappello.png" alt="Absidia Cappello" class="header-logo-cappello">
            <div>
                <img src="Logo Scritta.png" alt="ABSIDIA" class="header-logo-scritta">
            </div>
        </div>
    </header>

    <main>
        <div class="portal-content-box">
            <div class="dynamic-text" id="animatedText"><span id="textContent"></span><span class="cursor" id="cursorSpan"></span></div>
        </div>

        <div class="portal-nav-buttons">
            <a href="manutenzione.html" class="portal-btn">CODEX<br><span style="font-size: 0.75rem; font-weight: normal; letter-spacing: 1px;">I MANUALI</span></a>
            <a href="terre_unite.html" class="portal-btn">ELAYA<br><span style="font-size: 0.75rem; font-weight: normal; letter-spacing: 1px;">LE TERRE UNITE</span></a>
            <a href="absidia.html" class="portal-btn">ABSIDIA<br><span style="font-size: 0.75rem; font-weight: normal; letter-spacing: 1px;">IL NUOVO MONDO</span></a>
        </div>
    </main>

    <div class="admin-control-panel" id="adminPanel">
        <span>[ Console SysAdmin ]</span>
        <button class="admin-btn" id="editContentBtn">Modifica Contenuti</button>
    </div>

    <footer>
        <p>&copy; 2026 Absidia - Un progetto di Elaya - Tutti i diritti riservati.</p>
    </footer>

    <script>
        // --- CONTROLLO DI SICUREZZA ---
        const sessionRole = sessionStorage.getItem("absidia_session");

        if (!sessionRole || (sessionRole !== "admin_unlocked" && sessionRole !== "viewer_unlocked")) {
            window.location.href = "index.html";
        }

        if (sessionRole === "admin_unlocked") {
            const adminPanel = document.getElementById('adminPanel');
            if (adminPanel) {
                adminPanel.style.display = "block";
            }
        }

        document.getElementById('editContentBtn').addEventListener('click', () => {
            alert("Modalità di modifica attiva.");
        });

        // --- Logica Animazione Testo ---
        const textContainer = document.getElementById('textContent');
        const cursorSpan = document.getElementById('cursorSpan');
        const wrapperElement = document.getElementById('animatedText');

        const comingSoonText = "COMING SOON...";
        const dateText = "24 E 25 OTTOBRE";

        let state = 0;

        function typeWriter(text, i, callback) {
            if (i < text.length) {
                textContainer.textContent += text.charAt(i);
                setTimeout(() => typeWriter(text, i + 1, callback), 120);
            } else if (callback) {
                callback();
            }
        }

        function runCycle() {
            if (state === 0) {
                wrapperElement.classList.remove('pulse-effect');
                cursorSpan.style.display = "inline-block";
                textContainer.textContent = "";
                
                typeWriter(comingSoonText, 0, () => {
                    setTimeout(() => {
                        wrapperElement.classList.add('fade-out');
                        setTimeout(() => {
                            state = 1;
                            wrapperElement.classList.remove('fade-out');
                            runCycle();
                        }, 800);
                    }, 3000);
                });

            } else {
                cursorSpan.style.display = "none";
                textContainer.textContent = dateText;
                wrapperElement.classList.add('pulse-effect');

                setTimeout(() => {
                    wrapperElement.classList.add('fade-out');
                    setTimeout(() => {
                        state = 0;
                        wrapperElement.classList.remove('fade-out');
                        runCycle();
                    }, 800);
                }, 5000);
            }
        }

        runCycle();
    </script>

</body>
</html>
