<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absidia - Aggiorna Password</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=IM+Fell+English:ital@0;1&family=Uncial+Antiqua&display=swap" rel="stylesheet">
    <!-- Libreria client di Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-ocean: #09131a;
            --border-accent: #a9c6de;
            --text-foam: #e6edf2;
            --text-faded: #8aa0b3; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-ocean);
            color: var(--text-foam);
            font-family: 'IM Fell English', serif;
            font-size: 1.05rem;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .map-bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            overflow: hidden;
            background-color: var(--bg-ocean);
        }

        .map-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            filter: brightness(0.35) sepia(20%) hue-rotate(170deg);
        }

        .map-bg.active {
            opacity: 1;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('Logo Completo.png');
            background-position: center;
            background-repeat: no-repeat;
            background-size: 50% auto;
            opacity: 0.04;
            pointer-events: none;
            z-index: -1;
        }

        header {
            position: relative;
            text-align: center;
            padding: 1.5rem 1rem;
            background: linear-gradient(to bottom, rgba(5, 11, 15, 0.95), rgba(9, 19, 26, 0.8));
            border-bottom: 1px solid var(--text-faded);
        }

        .back-link {
            font-family: 'Cinzel', serif;
            color: var(--text-faded);
            text-decoration: none;
            font-size: 0.855rem;
            letter-spacing: 2px;
            transition: color 0.3s ease;
            position: absolute;
            left: 2rem;
            top: 2rem;
        }

        .back-link:hover {
            color: var(--text-foam);
        }

        .header-stack-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .header-logo-cappello {
            height: 90px;
            width: auto;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.9)) sepia(30%) hue-rotate(170deg) saturate(70%);
            opacity: 0.85;
        }

        .header-logo-scritta {
            height: 45px;
            width: auto;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.95));
        }

        /* Player Audio posizionato in alto a destra nell'intestazione */
        .audio-container {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        .audio-container audio {
            width: 220px;
            height: 30px;
            filter: sepia(30%) hue-rotate(170deg) saturate(70%);
            opacity: 0.85;
            transition: opacity 0.3s ease;
        }

        .audio-container audio:hover {
            opacity: 1;
        }

        main {
            width: 95%;
            max-width: 600px;
            margin: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 0;
        }

        .portal-card {
            background-color: rgba(17, 30, 38, 0.92);
            border: 2px solid var(--text-faded);
            border-radius: 6px;
            padding: 2rem;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            width: 100%;
        }

        .portal-card h2 {
            font-family: 'Cinzel', serif;
            color: var(--text-foam);
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .portal-card .instructions {
            font-style: normal;
            color: var(--text-faded);
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 1.5rem;
            display: block;
        }

        input {
            width: 100%;
            padding: 0.6rem;
            margin: 0.3rem 0 1rem 0;
            background: rgba(9, 19, 26, 0.9);
            border: 1px solid var(--text-faded);
            color: var(--text-foam);
            font-family: 'IM Fell English', serif;
            font-size: 1rem;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            border-color: var(--border-accent);
            box-shadow: 0 0 8px rgba(169, 198, 222, 0.35);
        }

        .portal-btn {
            font-family: 'Cinzel', serif;
            background-color: rgba(17, 30, 38, 0.9);
            color: var(--text-foam);
            border: 2px solid var(--text-faded);
            padding: 0.7rem 1.2rem;
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 1px;
            width: 100%;
            transition: all 0.3s ease;
        }

        .portal-btn:hover:not(:disabled) {
            background-color: var(--text-faded);
            color: var(--bg-ocean);
            border-color: var(--text-foam);
        }

        .error {
            color: #f87171;
            font-size: 0.95rem;
            margin-top: 0.8rem;
            font-style: italic;
            text-align: center;
        }

        .success {
            color: #4ade80;
            font-size: 0.95rem;
            margin-top: 0.8rem;
            font-style: italic;
            text-align: center;
        }

        /* Stile Popup Modale */
        #custom-popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 11, 15, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .custom-popup-box {
            background-color: rgba(17, 30, 38, 0.98);
            border: 2px solid var(--border-accent);
            padding: 2rem;
            border-radius: 8px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }

        .custom-popup-box h3 {
            font-family: 'Cinzel', serif;
            color: var(--border-accent);
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .custom-popup-box p {
            font-size: 1.05rem;
            margin-bottom: 1.5rem;
            color: var(--text-foam);
        }

        footer {
            text-align: center;
            padding: 0.8rem;
            color: var(--text-faded);
            font-size: 0.8rem;
            font-family: 'Cinzel', serif;
            border-top: 1px solid var(--text-faded);
            background-color: #070e12;
        }

        @media (max-width: 900px) {
            .back-link {
                position: static;
                display: block;
                margin-bottom: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Popup Modale Globale -->
    <div id="custom-popup-overlay">
        <div class="custom-popup-box">
            <h3 id="custom-popup-title">Notifica</h3>
            <p id="custom-popup-text">Messaggio...</p>
            <button class="portal-btn alt" onclick="chiudiPopupMessaggio()" style="margin-top: 0;">Chiudi</button>
        </div>
    </div>

    <div class="map-bg-container">
        <img src="Mappa.jpg" alt="Mappa" class="map-bg active" id="map1">
        <img src="mappaabsidia.jpg" alt="Mappa Absidia" class="map-bg" id="map2">
    </div>

    <header>
        <a href="index.html" class="back-link">&larr; TORNA AL LOGIN</a>
        <div class="header-stack-container">
            <img src="Cappello.png" alt="Absidia Cappello" class="header-logo-cappello">
            <img src="Logo Scritta.png" alt="ABSIDIA" class="header-logo-scritta">
        </div>
              
        <!-- Player Audio in alto a destra -->
        <div class="audio-container">
            <audio id="bgAudio" autoplay controls loop>
                <source src="Protettori.mp3" type="audio/mpeg">
                Il tuo browser non supporta l'elemento audio.
            </audio>
        </div>
    </header>

    <main>
        <div class="portal-card">
            <h2>Nuova Password</h2>
            <span class="instructions">Inserisci la tua nuova password di sicurezza per accedere nuovamente al portale di Absidia.</span>

            <div class="field-group">
                <label for="new-password" style="font-family: 'Cinzel', serif; font-size: 0.9rem; color: var(--text-faded); display: block; margin-bottom: 0.2rem;">Nuova Password</label>
                <input type="password" id="new-password" placeholder="Almeno 8 caratteri">
            </div>

            <button class="portal-btn" onclick="aggiornaPassword()">Aggiorna Password</button>
            <div id="status-message"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Absidia - Un progetto di Elaya - Tutti i diritti riservati.</p>
    </footer>

    <script>
        // Gestione audio di sottofondo
        document.addEventListener('mousemove', function() {
            const audio = document.getElementById('bgAudio');
            if (audio && audio.paused) {
                audio.play().catch(error => {
                    console.log("Riproduzione automatica impedita dal browser:", error);
                });
            }
        }, { once: true });

        // Animazione cambio mappe sullo sfondo
        const map1 = document.getElementById('map1');
        const map2 = document.getElementById('map2');
        setInterval(() => {
            map1.classList.toggle('active');
            map2.classList.toggle('active');
        }, 4000);

        function mostraPopup(titolo, testo) {
            document.getElementById('custom-popup-title').innerText = titolo;
            document.getElementById('custom-popup-text').innerText = testo;
            document.getElementById('custom-popup-overlay').style.display = 'flex';
        }

        function chiudiPopupMessaggio() {
            document.getElementById('custom-popup-overlay').style.display = 'none';
        }

        // Configurazione Supabase
        const SUPABASE_URL = 'https://mblrwjzrbvddurmlgvlf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Yk7HgEemUbfqMAxgjVHygQ_UVenqgio';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                storage: window.sessionStorage,
                persistSession: true,
                autoRefreshToken: true,
            }
        });

        async function aggiornaPassword() {
            const newPassword = document.getElementById('new-password').value;
            const statusMessage = document.getElementById('status-message');

            if (!newPassword || newPassword.length < 8) {
                statusMessage.className = "error";
                statusMessage.innerText = "La password deve contenere almeno 8 caratteri.";
                return;
            }

            const { data, error } = await supabaseClient.auth.updateUser({
                password: newPassword
            });

            if (error) {
                statusMessage.className = "error";
                statusMessage.innerText = "Errore durante l'aggiornamento: " + error.message;
            } else {
                statusMessage.className = "success";
                statusMessage.innerText = "Password aggiornata con successo! Verrai reindirizzato al login...";
                setTimeout(() => {
                    window.location.href = 'index.html'; // Sostituisci con la pagina di login se ha un nome diverso
                }, 3000);
            }
        }
    </script>
</body>
</html>
